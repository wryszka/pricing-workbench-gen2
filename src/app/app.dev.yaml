# Pricing Workbench gen2 — dev env values (fevm-lr-dev-aws-us). This is the
# eventual home where gen2 replaces gen1. gen2-namespaced (schema
# pricing_workbench_gen2, pwg2_ assets) so it coexists with gen1 during cutover.
# deploy.sh copies this over app.yaml before `bundle deploy --target dev`.
command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: CATALOG_NAME
    value: "lr_dev_aws_us_catalog"
  - name: SCHEMA_NAME
    value: "pricing_workbench_gen2"
  - name: WAREHOUSE_ID
    value: "a3b61648ea4809e3"
  - name: GENIE_SPACE_ID
    value: ""
  - name: GENIE_QUOTE_SPACE_ID
    value: ""
  - name: MART_DASHBOARD_ID
    value: ""
  - name: BUNDLE_FILES_BASE
    value: "/Workspace/Shared/.bundle/pricing-workbench-gen2/dev/files/src"
  - name: BUNDLE_NAME
    value: "pricing-workbench-gen2"
  - name: BUNDLE_TARGET
    value: "dev"
  # Comma-separated emails allowed to run destructive admin actions (demo reset,
  # sleep, AI-mode/cache) — so a random viewer can't wipe a live demo.
  # IMPORTANT: every presenter must be listed here. Add their email before the
  # session; an empty value locks everyone out (the guard is fail-closed).
  - name: ADMIN_USERS
    value: "laurence.ryszka@databricks.com,sa-presenter@databricks.com"
