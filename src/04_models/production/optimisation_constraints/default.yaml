# ---------------------------------------------------------------------------
# Price-optimization constraint set — VERSIONED IN THE REPO (motor).
#
# This file IS the pricing policy. The solver (optimisation_solver.py) reads it
# and is bound by it; a future agent cannot bypass it — the deployment gate
# enforces the corridor server-side. Change it via pull request: the git history
# of THIS file is the auditable record of how the pricing policy evolved.
#
# Demo beat: open this file + `git log -p` on it, live, in the room.
#
# ENFORCEMENT MODEL — be honest about HOW each rule below binds (Phase 1, motor
# new-business factors):
#   * SOLVE-TIME ENFORCED (hard): deviation_corridor + segment_caps — they set the
#     solver's per-segment factor bounds, and the deploy gate re-checks the
#     corridor server-side. A factor outside them cannot be produced or deployed.
#   * ENFORCED BY CONSTRUCTION: forbidden_signals — the optimised factor is keyed
#     only on the age×vehicle segment, so protected characteristics are never
#     optimisation levers in the first place; proxy_correlation_max is then
#     verified post-solve by the fairness job (optimisation_fairness).
#   * MONITORED, NOT YET SOLVE-TIME ENFORCED: the renewal/GIPP rule. Phase 1
#     optimises NEW-BUSINESS factors; it does not reprice renewals, so GIPP is
#     tracked by the monitoring/fairness jobs (breach tile) rather than enforced
#     inside the solver. Renewal optimisation with in-solver GIPP is Phase 2.
#     (See docs/DEMO_QA.md and docs/optimisation_runbook.md.)
# ---------------------------------------------------------------------------
version: "v1"
effective_from: "auto"          # resolved to the current rate-book month at solve time
approved_by: "pricing_committee@bricksurance.example"
narrative: >
  Launch constraint set for personal motor. Deviation corridor of +/-15% around
  the technical (risk) price; renewals never priced above equivalent new business
  (UK GIPP); per-segment rate-change caps; protected/proxy signals excluded from
  the optimisation objective; monotonicity and sanity floors enforced.

# --- Jurisdiction toggles ---------------------------------------------------
# The single switch that makes the same engine legal in different regimes.
jurisdiction:
  name: "UK"
  elasticity_may_contribute: true        # UK: demand may shape margin above the floor.
                                         # Set false for US cost-based states — the
                                         # solver then holds to technical (factor 1.0).
  gipp_renewal_rule: true                # UK GIPP: renewal price <= equivalent new business.
  consumer_duty_fair_value: true         # fair-value evidence pack required before deploy.

# --- Deviation corridor around the technical (risk) price -------------------
# The optimiser shapes margin ONLY within this corridor. The risk model is the
# floor; this bounds how far price may move from it.
deviation_corridor:
  lower_pct: -15.0                       # never price below 85% of technical position
  upper_pct:  15.0                       # never price above 115% of technical position
  hard: true                             # breaches are rejected, not warned

# --- Renewal rule (GIPP) ----------------------------------------------------
renewal:
  max_vs_equivalent_new_business_pct: 0.0   # renewal <= equivalent NB price (GIPP)
  max_year_on_year_increase_pct: 25.0       # anti-shock cap on any single renewal

# --- Per-segment rate-change caps -------------------------------------------
# How far the book may move in one optimisation cycle, per segment (age·vehicle band).
segment_caps:
  by: "age_vehicle_band"                 # matches the 3x3 segment scheme in the notebooks
  max_increase_pct: 10.0
  max_decrease_pct: 12.0
  # Optional per-segment overrides (segment_key: {max_increase_pct, max_decrease_pct}).
  # U25 drivers are rate-sensitive and politically watched — cap their increases tighter.
  overrides:
    "U25 · grpLow":  {max_increase_pct: 6.0}
    "U25 · grpMid":  {max_increase_pct: 6.0}
    "U25 · grpHigh": {max_increase_pct: 6.0}

# --- Forbidden signals ------------------------------------------------------
# Features that must NOT influence the optimised price (directly or as a lever).
# A fairness reviewer proxy-tests rating factors against these.
forbidden_signals:
  - gender
  - marital_status
  - postcode_demographic          # demographic quintile — proxy risk
  - occupation_social_grade       # social-grade proxy
proxy_correlation_max: 0.35       # flag any rating factor correlating > this with a forbidden signal

# --- Monotonicity & sanity --------------------------------------------------
sanity:
  price_monotone_in_risk: true    # higher technical premium -> not-lower charged premium
  demand_monotone_in_price: true  # P(convert) must fall as price rises (enforced in the model too)
  min_premium: 150.0              # absolute floor (matches rating engine)
  max_premium: 50000.0

# --- Objective --------------------------------------------------------------
objective:
  maximise: "expected_profit"     # expected_profit | expected_gwp | retention_weighted_profit
  # expected_profit = sum over segments of P(convert|price) * (price - technical_cost)
  retention_weight: 0.0           # >0 tilts toward volume/retention over pure margin
