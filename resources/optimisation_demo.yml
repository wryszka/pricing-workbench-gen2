# Optimisation demo (Chapter 1) — the honest teaching flow's Databricks job.
# One job, dedicated optimisation_demo_* tables. Does NOT touch the workbench tables.
resources:
  jobs:
    optimisation_demo_run:
      name: "Optimisation demo — run (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: example_id
          default: "grandma_bmw_v1"
        - name: app_run_id
          default: ""
        - name: min_expected_customers
          default: ""          # blank = no sales requirement (Run A); e.g. 830 = Run B
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: run
          notebook_task:
            notebook_path: ../src/app/server/optimisation_demo/run_demo.py
            base_parameters:
              catalog_name:           "{{job.parameters.catalog_name}}"
              schema_name:            "{{job.parameters.schema_name}}"
              example_id:             "{{job.parameters.example_id}}"
              app_run_id:             "{{job.parameters.app_run_id}}"
              min_expected_customers: "{{job.parameters.min_expected_customers}}"
              # the synced files root + /src/app so `server.optimisation_demo.core` imports
              app_src_base:           "${workspace.file_path}/src/app"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: []

    # --- Chapter 2: prepare the frozen data + model (run once before recording) ---
    optimisation_demo_ch2_prepare:
      name: "Optimisation demo — Chapter 2 prepare (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: model_version
          default: "ch2-demand-v1"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: prepare
          notebook_task:
            notebook_path: ../src/app/server/optimisation_demo/jobs/ch2_prepare.py
            base_parameters:
              catalog_name:  "{{job.parameters.catalog_name}}"
              schema_name:   "{{job.parameters.schema_name}}"
              model_version: "{{job.parameters.model_version}}"
              app_src_base:  "${workspace.file_path}/src/app"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [scikit-learn, scipy, pandas, numpy, joblib]

    # --- Chapter 2: score -> solve for one requirement ---
    optimisation_demo_ch2_run:
      name: "Optimisation demo — Chapter 2 run (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: app_run_id
          default: ""
        - name: model_version
          default: "ch2-demand-v1"
        - name: min_portfolio_sales_ratio
          default: ""          # blank = margin-first; e.g. 0.98 = protect sales
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: run
          notebook_task:
            notebook_path: ../src/app/server/optimisation_demo/jobs/ch2_run.py
            base_parameters:
              catalog_name:              "{{job.parameters.catalog_name}}"
              schema_name:               "{{job.parameters.schema_name}}"
              app_run_id:                "{{job.parameters.app_run_id}}"
              model_version:             "{{job.parameters.model_version}}"
              min_portfolio_sales_ratio: "{{job.parameters.min_portfolio_sales_ratio}}"
              app_src_base:              "${workspace.file_path}/src/app"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [scikit-learn, scipy, pandas, numpy, joblib]

    # --- Chapter 2: governance setup (approval procedure + gate) — run once ---
    optimisation_demo_ch2_governance:
      name: "Optimisation demo — Chapter 2 governance setup (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: approver_users
          default: "laurence.ryszka@databricks.com"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: governance
          notebook_task:
            notebook_path: ../src/app/server/optimisation_demo/jobs/ch2_governance_setup.py
            base_parameters:
              catalog_name:   "{{job.parameters.catalog_name}}"
              schema_name:    "{{job.parameters.schema_name}}"
              approver_users: "{{job.parameters.approver_users}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: []

    # --- Chapter 2: synthetic outcome check on the active release ---
    optimisation_demo_ch2_check:
      name: "Optimisation demo — Chapter 2 check (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: check
          notebook_task:
            notebook_path: ../src/app/server/optimisation_demo/jobs/ch2_check.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
              app_src_base: "${workspace.file_path}/src/app"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [pandas, numpy]
