# Demo reset — fired from the landing-page button to put the workbench
# back in clean demo state.
resources:
  jobs:
    demo_reset:
      name: "v1 — Demo reset (landing page button) (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: app_service_principal_id
          default: ${var.app_service_principal_id}
        - name: warehouse_id
          default: ${var.warehouse_id}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: reset
          notebook_task:
            notebook_path: ../src/04_models/production/demo_reset.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name:  ${var.schema_name}
              app_service_principal_id: ${var.app_service_principal_id}
              warehouse_id: ${var.warehouse_id}
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            # demo_reset inline-runs the rolling release/rating seeds, which use
            # MlflowClient; pin mlflow + sdk so the reset never fails on a missing dep.
            dependencies:
              - mlflow
              - databricks-sdk
