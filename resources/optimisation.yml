# Price Optimization module jobs (motor, §3–§8). Serverless, idempotent.
# Naming: British `optimisation_*` / `optimisation` — evolved in place (this
# module keeps the existing prefix rather than the spec's `opt_*`, per decision).
# Jobs are defined here and chained by the `optimisation_full` orchestrator;
# they join Full Build only when `enable_optimization` is true (added at §12).
resources:
  jobs:

    # --- §3 data: motor quote-response + renewal + portfolio snapshot ----------
    optimisation_data:
      name: "Price optimisation — motor quote/renewal data (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: price_variation_sd
          default: "0.12"
        - name: n_months
          default: "13"
        - name: max_policies
          default: "120000"
        - name: base_conv_elasticity
          default: "6.0"
        - name: base_ret_elasticity
          default: "9.0"
        - name: technical_source
          default: "champion"   # GATE-1: champion-scored via inner-model load (rung c)
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: generate
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_motor_data.py
            base_parameters:
              catalog_name:         "{{job.parameters.catalog_name}}"
              schema_name:          "{{job.parameters.schema_name}}"
              price_variation_sd:   "{{job.parameters.price_variation_sd}}"
              n_months:             "{{job.parameters.n_months}}"
              max_policies:         "{{job.parameters.max_policies}}"
              base_conv_elasticity: "{{job.parameters.base_conv_elasticity}}"
              base_ret_elasticity:  "{{job.parameters.base_ret_elasticity}}"
              technical_source:     "{{job.parameters.technical_source}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies:
              - mlflow
              - scikit-learn
              - statsmodels
              - pandas
              - numpy
              - python-dateutil

    # --- §4 elasticity: monotone conversion + retention + curve + red-team ------
    optimisation_elasticity:
      name: "Price optimisation — elasticity models (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_elasticity.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [mlflow, lightgbm, scikit-learn, pandas, numpy]

    # --- §5 simulation: N candidate price sets → scenarios + frontier ----------
    optimisation_simulation:
      name: "Price optimisation — simulation (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: grid_points
          default: "3000"
        - name: corridor_pct
          default: "15"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: simulate
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_simulation.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
              grid_points:  "{{job.parameters.grid_points}}"
              corridor_pct: "{{job.parameters.corridor_pct}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [pandas, numpy]

    # --- §6 solver: constrained arg-max under the versioned YAML → factor table -
    optimisation_solver:
      name: "Price optimisation — constrained solver (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: constraint_version
          default: "v1"
        - name: objective
          default: ""      # blank = use the YAML objective
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: solve
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_solver.py
            base_parameters:
              catalog_name:       "{{job.parameters.catalog_name}}"
              schema_name:        "{{job.parameters.schema_name}}"
              constraint_version: "{{job.parameters.constraint_version}}"
              objective:          "{{job.parameters.objective}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [scipy, pyyaml, pandas, numpy]

    # --- §8 monitoring: actual-vs-expected drift + deviation + breaches --------
    optimisation_monitoring:
      name: "Price optimisation — monitoring (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: corridor_pct
          default: "15"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: monitor
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_monitoring.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
              corridor_pct: "{{job.parameters.corridor_pct}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [mlflow, lightgbm, scikit-learn, pandas, numpy]

    # --- §11 fairness & fair-value evidence (screens the solved factor set) ----
    optimisation_fairness:
      name: "Price optimisation — fairness & fair-value evidence (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: screen
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_fairness.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [pandas, numpy, pyyaml]

    # --- §11 immutable decision records (creates table, seeds, backfills) ------
    optimisation_decision_record:
      name: "Price optimisation — decision records (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: records
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_decision_record.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [mlflow, pandas]

    # --- §11 explain-this-price UC function -----------------------------------
    optimisation_explain_price:
      name: "Price optimisation — explain-price function (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: create_fn
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_explain_price.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [pandas]

    # --- closed loop: advance one month under the deployed prices (§3 tail) ----
    optimisation_advance_month:
      name: "Price optimisation — advance month (did it work?) (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: advance
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_advance_month.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [pandas, numpy, python-dateutil]

    # --- §11a HEAVY MODE: DEFINED-BUT-DORMANT, never in full_build ------------
    # The big-hammer second gear: ensemble disagreement map + exhaustive
    # per-policy Monte-Carlo run. Run on demand; captures real measured cost.
    optimisation_heavy_mode:
      name: "Price optimisation — heavy mode (ensemble + stochastic) (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: preset
          default: "default"      # default (heavy, pre-computed) | live (small, room-safe)
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: heavy
          notebook_task:
            notebook_path: ../src/04_models/production/optimisation_heavy_mode.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name:  "{{job.parameters.schema_name}}"
              preset:       "{{job.parameters.preset}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [lightgbm, scikit-learn, pandas, numpy]

    # --- §7B real-time elasticity serving tier: DEFINED-BUT-DORMANT ------------
    # Not chained into full_build; armed on demand (scale-to-zero, ~free idle),
    # torn down after. Batch spine is unaffected — execution mode is a flag.
    optimisation_elasticity_serve_provision:
      name: "Price optimisation — arm elasticity scorer (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: endpoint_name
          default: "pwg2_elasticity_scorer"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: provision
          notebook_task:
            notebook_path: ../src/07_serving/optimisation_elasticity_serve/provision.py
            base_parameters:
              catalog_name:  "{{job.parameters.catalog_name}}"
              schema_name:   "{{job.parameters.schema_name}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [mlflow, databricks-sdk]

    optimisation_elasticity_serve_teardown:
      name: "Price optimisation — tear down elasticity scorer (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: endpoint_name
          default: "pwg2_elasticity_scorer"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: teardown
          notebook_task:
            notebook_path: ../src/07_serving/optimisation_elasticity_serve/teardown.py
            base_parameters:
              catalog_name:  "{{job.parameters.catalog_name}}"
              schema_name:   "{{job.parameters.schema_name}}"
              endpoint_name: "{{job.parameters.endpoint_name}}"
          environment_key: env
      environments:
        - environment_key: env
          spec:
            client: "5"
            dependencies: [databricks-sdk]

    # --- orchestrator: the whole offline spine as one governed DAG -------------
    # data → elasticity → simulation → solver → monitoring. This is what the
    # Walkthrough triggers and what Full Build chains (behind enable_optimization).
    optimisation_full:
      name: "Price optimisation — full build (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: grid_points
          default: "3000"
      permissions:
        - service_principal_name: ${var.app_service_principal_id}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: data
          run_job_task:
            job_id: ${resources.jobs.optimisation_data.id}
        - task_key: elasticity
          depends_on: [{task_key: data}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_elasticity.id}
        - task_key: simulation
          depends_on: [{task_key: elasticity}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_simulation.id}
        - task_key: solver
          depends_on: [{task_key: elasticity}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_solver.id}
        - task_key: monitoring
          depends_on: [{task_key: elasticity}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_monitoring.id}
        - task_key: fairness
          depends_on: [{task_key: solver}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_fairness.id}
        - task_key: decision_record
          depends_on: [{task_key: fairness}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_decision_record.id}
        - task_key: explain_price
          depends_on: [{task_key: decision_record}]
          run_job_task:
            job_id: ${resources.jobs.optimisation_explain_price.id}
